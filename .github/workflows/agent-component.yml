name: Agent component
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-component-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/ores.agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: projects/ores.agent/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Set up pinned NATS broker (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: .
        run: ./build/scripts/setup_nats_server.sh
      - name: Set up pinned NATS broker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: ./build/scripts/setup_nats_server.ps1
      - name: Verify persisted synthetic FX data through NATS
        run: node evals/persisted-fx-ci.mjs
      - run: npm run package
      - name: Smoke test the Linux agent image
        if: runner.os == 'Linux' && matrix.node == 24
        shell: bash
        run: |
          docker build --tag ores-agent:ci .
          config="$(mktemp)"
          node --input-type=module -e 'import fs from "node:fs"; const c = JSON.parse(fs.readFileSync("config.container.example.json")); c.nats = null; process.stdout.write(JSON.stringify(c));' > "$config"
          chmod 644 "$config"
          container="$(docker run -d --read-only --cap-drop=ALL --security-opt=no-new-privileges --publish 127.0.0.1::20100 --mount "type=bind,src=$config,dst=/run/ores-agent/agent.json,readonly" ores-agent:ci)"
          trap 'docker rm -f "$container" >/dev/null; rm -f "$config"' EXIT
          address="$(docker port "$container" 20100/tcp)"
          curl --fail --silent --show-error --retry 10 --retry-connrefused "http://$address/healthz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ores-agent-${{ matrix.os }}-node${{ matrix.node }}
          path: projects/ores.agent/artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ores-agent-replay-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            build/output/agent-checks/
            build/output/agent-nats/
          if-no-files-found: ignore
